[project]
name = "crypto-lob-alpha"
version = "0.1.0"
description = "Record crypto L2 order books, rebuild them correctly, and test short-horizon signals against fees and latency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx[http2]>=0.27",
    "numpy>=2.1",
    "orjson>=3.10",
    "polars>=1.20",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sortedcontainers>=2.4",
    "structlog>=24.4",
    "typer>=0.12",
    "uvloop>=0.21; sys_platform != 'win32'",
    "websockets>=15.0",
    "zstandard>=0.23",
]

[project.scripts]
lob = "lob_alpha.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_alpha"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "NPY", "PL"]
ignore = [
    "PLR0911", # adapters dispatch on message type
    "PLR0912",
    "PLR0913", # row writers take one argument per schema column
    "PLR0915",
    "PLR0917",
    "PLR2004", # exchange protocols are full of literal constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "PLW0603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sortedcontainers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra --benchmark-skip"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests",
    "data: needs recorded data, local only",
    "network: talks to live venues, local only",
]

[tool.coverage.run]
source = ["lob_alpha"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\.$"]
