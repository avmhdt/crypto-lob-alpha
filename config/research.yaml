version: 1
seed: 42
universe:
  - {venue: binance-usdm, symbol: BTCUSDT}
  - {venue: binance-usdm, symbol: ETHUSDT}
  - {venue: binance-usdm, symbol: SOLUSDT}
  - {venue: coinbase, symbol: BTC-USD}
  - {venue: coinbase, symbol: ETH-USD}
  - {venue: coinbase, symbol: SOL-USD}
  - {venue: kraken, symbol: BTC/USD}
  - {venue: kraken, symbol: ETH/USD}
  - {venue: kraken, symbol: SOL/USD}
dates: {start: auto, end: auto, complete_days_only: true}  # auto = all complete days (DQ-10)
timestamp: ts_recv  # ts_exchange only for the sensitivity run
grids:
  time_ms: 100  # clock-time sample grid
  event: book_batch  # event-time unit = one LIVE book batch
features:
  ofi: {windows_events: [10, 50, 200], windows_ms: [100, 1000, 10000], normalize: train_mean_l1_depth}
  mlofi: {levels: 10, windows_events: [50], windows_ms: [1000], integrated_pca: true}
  queue_imbalance: {levels: [1, 5]}
  microprice: {method: stoikov2018, imbalance_buckets: 10, max_spread_ticks: 4, also_weighted_mid: true}
  trade_sign_imbalance: {windows_events: [50, 200], windows_ms: [1000, 10000], weights: [volume, count]}
  spread: {unit: ticks}
  realized_vol: {windows_ms: [1000, 10000, 60000], sample_ms: 100}
labels:
  horizons_ms: [100, 250, 500, 1000, 2000, 5000, 10000, 30000]
  horizons_events: [1, 5, 10, 25, 50, 100, 250, 500]
  latencies_ms: [0, 1, 5, 10, 25, 50, 100, 250, 500, 1000]
walk_forward: {train_days: 5, val_days: 1, test_days: 1, step_days: 1, purge_s: 31}
models:
  ridge: {alphas: [0.1, 1, 10, 100, 1000], standardize: true}
  lgbm:
    objective: [regression, huber]
    num_leaves: [15, 63]
    learning_rate: 0.05
    n_estimators: 2000
    early_stopping_rounds: 100
    min_data_in_leaf: 500
    feature_fraction: 0.8
    deterministic: true
    num_threads: 8
exec:
  size_usd: 10000
  thresholds: {method: train_quantile, quantiles: [0.8, 0.9, 0.95, 0.99]}
  latency_ms: [0, 1, 5, 10, 25, 50, 100, 250, 500, 1000]
  home_latency: measured  # D-10
  taker: {exit: [taker, mid_mark]}
  maker: {alive_ms: [1000, 5000], queue_model: conservative}
  fee_scenarios: [base, maker_zero, taker_minus_30pct]  # D-09
  markouts_ms: [100, 1000, 5000, 30000]
stats: {bootstrap_resamples: 2000, block: day, ci: 0.95}
