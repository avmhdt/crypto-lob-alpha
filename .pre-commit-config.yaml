repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src only)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: no-data-files
        name: reject data files
        entry: bash -c 'echo "data files must not be committed:"; printf "%s\n" "$@"; exit 1' --
        language: system
        files: '(\.parquet$|\.zst$|\.csv\.gz$|^data/)'
